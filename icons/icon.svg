<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa14e"/>
      <stop offset="1" stop-color="#f47205"/>
    </linearGradient>
  </defs>
  <!-- rounded-square tile (same construction as the pdfxtn family icon) -->
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- soft top highlight -->
  <rect x="0" y="0" width="128" height="62" rx="30" fill="#ffffff" opacity="0.10"/>
  <!-- bold T (Taskmana) -->
  <path d="M 38 40 L 90 40 M 64 40 L 64 92"
        fill="none" stroke="#ffffff" stroke-width="14"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
