name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (TS strict over JS source)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Screenshot baselines are macOS-rendered; CI runs every visual test's
      # flow but skips the pixel comparison (see ignoreSnapshots in config).
      - name: E2E, accessibility, and visual flows
        run: npm run test:e2e
